# PR-tier CI — the cross-platform matrix, standing up before any runtime code.
#
# It exists first, deliberately: a three-OS matrix surfaces platform issues
# (especially Windows) at the cheapest possible point — before there is code
# to debug them against. It runs no external CLIs and needs no credentials.
#
# One command, one source of truth: every job runs `cargo xtask <task>`, the
# same dev-task runner a contributor runs locally (see CONTRIBUTING.md). If it
# passes on your machine it passes here, because it is the identical logic.
#
# Runner pinning is intentional, not incidental:
#   - ubuntu-24.04 and macos-14 (arm64) are pinned to exact images.
#   - windows-2022: GitHub-hosted runners offer Windows *Server* only, so this
#     is the closest stable console lineage. Windows 11 *client* behaviour is
#     validated on real hardware by a later probe, and on a self-hosted runner
#     if drift appears. Do NOT switch to windows-latest — the pin is the point;
#     an image bump must be a reviewed change, not a silent one.
#
# Toolchain: pinned by rust-toolchain.toml; rustup on the hosted runners
# resolves the pinned channel automatically.
#
# Supply chain: third-party actions are pinned by full commit SHA.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is here for the live tier: its gate reads the labels off the
    # event payload, so without this a `ci:live` label would do nothing until
    # the next push. `unlabeled` is the counterpart — removing the label is how
    # a maintainer aborts a running live job: the removal fires a fresh run
    # whose `live-cli` is skipped (label gone), and the concurrency group below
    # cancels the in-flight one, so the quota stops burning immediately. The
    # cost is that every label change re-runs the PR tier; the same concurrency
    # group cancels the superseded run.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift-gate:
    name: drift gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The gate reads the head commit message for WAIVE-DRIFT. On
          # pull_request events the default checkout is GitHub's synthetic
          # merge commit, whose message would hide a contributor's waiver —
          # check out the PR head commit so the scan and the waiver both
          # apply to what was actually pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        # No toolchain argument on purpose: rustup ≥ 1.28 reads
        # rust-toolchain.toml, so this installs the pin explicitly and fails
        # loudly if it cannot be resolved.
        run: rustup toolchain install && rustup show
      - name: Reserved-pattern drift gate
        run: cargo xtask drift-gate

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Wall-clock budget for the synchronous PR lane; an overrun is an infra
    # failure to re-run, not a test failure to debug.
    timeout-minutes: 45
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Same PR-head checkout as the drift-gate job: `cargo xtask ci`
          # ends with the drift gate, which reads the head commit message
          # for WAIVE-DRIFT — a waiver would be invisible on the synthetic
          # merge commit that pull_request events check out by default.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        # No toolchain argument on purpose: rustup ≥ 1.28 reads
        # rust-toolchain.toml, so this installs the pin explicitly and fails
        # loudly if it cannot be resolved.
        run: rustup toolchain install && rustup show
      - name: Format + clippy + build + test + probes
        run: cargo xtask ci

  # The performance benchmark lane: release-built latency and throughput
  # measurements, then the regression gate against the committed per-OS
  # baseline (tools/perf-probe/baselines/). The gate is relative on purpose —
  # hosted runners are too noisy for absolute latency verdicts, so what fails
  # a push is getting measurably worse than the recorded baseline, not
  # missing a budget. Absolute verdicts live in the report JSON this job
  # prints, and in the nightly endurance lanes. Until a baseline is recorded
  # for an OS the gate passes with a notice; record one deliberately by
  # copying a trusted run's report into baselines/ and committing it.
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one OS regressing must not hide the others' numbers
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - name: Benchmarks + regression gate
        run: cargo xtask bench
      - name: Report JSON into the job log
        # The reports are the durable output; the log is where a reviewer
        # reads them without downloading anything.
        if: always()
        shell: bash
        run: |
          for report in target/perf/*.json; do
            [ -f "$report" ] || continue
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

  # A PTY that allocates on a hosted runner can still be denied inside a
  # container — the shape most deployments actually run in. The runner lane
  # above proves the host case; this one proves the container case, and it is
  # the only place the two can diverge.
  probes-container:
    name: probes (linux container)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:bookworm-slim
    steps:
      # Before checkout, deliberately: the slim image ships no git, and a
      # checkout without it silently falls back to a tarball download — which
      # would leave the drift gate's `git ls-files` with nothing to read.
      # rustup needs curl, and linking needs a C toolchain. bash is named
      # even though Debian's base system carries it: the probe's echo child
      # hard-depends on it, and a hard dependency should not be inherited
      # silently from base-image policy.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends bash build-essential ca-certificates curl git
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        # The container has no rustup. Install it without a default toolchain
        # so rust-toolchain.toml — not rustup's own default — picks the pin.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain components
        run: rustup toolchain install && rustup show
      - name: PTY allocation and interactive stand-in inside the container
        run: cargo xtask probe

  # The live tier: spawns a real interactive CLI. Opt-in per PR via the
  # `ci:live` label, because it costs API quota and depends on an upstream
  # service — neither belongs in the lane every push pays for. A contributor
  # without label permissions therefore cannot burn quota.
  #
  # Serial by construction (`max-parallel: 1`): concurrent sessions against
  # one credential contend for rate limits, and a rate-limit failure here
  # would look like a probe failure.
  #
  # Windows is absent from this matrix on purpose — see the carried lane note
  # at the bottom of this file.
  #
  # UNVERIFIED, and deliberately labelled as such: this lane has only ever run
  # against a developer machine whose CLI was already onboarded. A pristine
  # runner HOME may put a first-run screen (theme, API-key confirmation) in
  # front of the workspace-trust dialog. The probe presses Enter at any
  # pre-session screen, up to five times, which should clear a chain of
  # accept-the-default prompts — but if it stalls, `session_start` fails with
  # the screen contents in its detail, and that log is the thing to read. The
  # first `ci:live` run is the experiment.
  live-cli:
    name: live CLI (${{ matrix.os }})
    # This workflow also runs on pushes to main, where `pull_request` is null.
    # Dereferencing it there happens to yield a falsy value rather than an
    # error, so the job would be skipped either way — but the label gate would
    # be resting on that leniency. Say "pull requests only" outright.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:live')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check the credential is available
        # Fork PRs get no secrets, so a maintainer-applied `ci:live` label on a
        # fork would otherwise run this job and fail it at the live step for a
        # reason no contributor can fix. Read the key in this step's own scope,
        # emit only whether it is present, and let the steps below skip when it
        # is not: a job with nothing to do is green, a job that fails on a
        # withheld secret is misleading noise. The value is never printed —
        # only present/absent, matching the live-CLI credential policy.
        id: cred
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "credential present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not available (fork PR, or secret unset); skipping the live-CLI lane."
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.cred.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        if: steps.cred.outputs.present == 'true'
        run: rustup toolchain install && rustup show
      - name: Install the CLI under test
        if: steps.cred.outputs.present == 'true'
        # Fetched to a file and checked against a pinned hash before it runs,
        # rather than piped into a shell. This step runs before — and installs
        # the binary run by — the step that holds ANTHROPIC_API_KEY, so a
        # silently changed installer would be a path to that secret. The
        # installer already verifies the CLI *binary* against a sha256 in its
        # own manifest; the one artifact it cannot vouch for is itself, and
        # that is what this pin covers.
        #
        # Expect to bump INSTALLER_SHA256 when upstream changes the installer:
        # that is the point, the same reviewed-bump contract the runner images
        # and pinned actions already carry. The CLI version is pinned for the
        # neighbouring reason — this lane's numbers only mean something against
        # a known build.
        env:
          CLAUDE_VERSION: 2.1.206
          INSTALLER_SHA256: b3f79015b54c751440a6488f07b1b64f9088742b9052bc1bd356d13108320d2a
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://claude.ai/install.sh -o install.sh
          # sha256sum is the Linux spelling, shasum the macOS one.
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum install.sh | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 install.sh | cut -d' ' -f1)
          fi
          echo "installer sha256: $actual"
          if [ "$actual" != "$INSTALLER_SHA256" ]; then
            echo "::error::install.sh sha256 is $actual, expected $INSTALLER_SHA256. Review the new installer, then bump INSTALLER_SHA256." >&2
            exit 1
          fi
          bash install.sh "$CLAUDE_VERSION"
          rm -f install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Real interactive CLI under our PTY
        # The probe types `/exit` and closes the PTY in its own teardown step,
        # so a session is never left running behind a failed assertion. The
        # key reaches only this step and the presence-check above, and only its
        # presence is ever logged.
        if: steps.cred.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cargo xtask live-probe

# CARRIED LANE — Windows named-pipe hook transport, still carried, not yet
# executed. On Windows the runtime's hook helper does its approval round-trip
# over a named pipe (a Unix domain socket elsewhere), and only a Windows host
# can verify that path. The four-point check is: (1) the hook fires under
# ConPTY and its payload reaches a named-pipe listener, (2) the allow/deny/ask
# approval round-trip behaves identically to the POSIX socket results, (3) the
# transcript channel writes under ConPTY, (4) Ctrl+C interrupt semantics hold
# under ConPTY.
#
# The runner now exists — `interactive-probe fourpoint` implements all four
# points and reports each one green or red independently, so a partial result
# is legible rather than one opaque failure. It runs on every OS, and the
# live-cli lane above runs it on macOS and Linux: that POSIX run is the
# baseline the word "identically" in point (2) refers to.
#
# What is still missing is the Windows *run*. It must happen on Windows 11
# **client** hardware, and every GitHub-hosted Windows runner is Windows
# **Server**. Wiring it onto the windows-2022 lane would let Server impersonate
# client coverage, which is the error the runner pin above exists to prevent.
# So the lane stays carried until the four points are run on client hardware
# and the evidence is attached to a PR; only then does this note become a job.
#
# Lanes to attach as the project grows (kept out of the PR tier deliberately):
#   - each platform probe joins the `check` matrix as it lands.
#   - the nightly tier exists (nightly.yml: the half-hour endurance lanes and
#     the nightly benchmark set); its fixture re-record and adapter-pattern
#     fuzz lanes, and a release/tag tier, arrive with the conformance
#     harness. See CONTRIBUTING.md for the tier policy.
