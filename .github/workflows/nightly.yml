# Nightly tier — the lanes that cannot run on every push, for two different
# reasons.
#
# Most of them are too long for the synchronous PR budget: two half-hour
# streaming soaks (synthetic and bimodal-recorded) with the resource monitor
# over both, a byte-for-byte recorded replay where the terminal is a
# transparent pipe, and the nightly benchmark set including the
# throughput-versus-concurrency curve.
#
# The supply-chain advisories lane is here for the opposite reason. It is
# quick, and it already runs on every pull request; it repeats here because its
# answer can change with no commit behind it, and a schedule is the only thing
# that catches that.
#
# One command, one source of truth: each job's payload is a `cargo xtask` task
# a maintainer runs locally the same way, so a red lane is reproducible on a
# desk without reverse-engineering workflow steps.
#
# Failure policy: a red nightly alerts the maintainer (GitHub notifies the
# workflow author on scheduled-run failures) and does not block PR merges.
# The triage path: read the failing step's log — every lane prints
# machine-readable step lines and its report JSON is dumped below — and
# reproduce locally with the same xtask task — and when it will not
# reproduce, suspect the difference rather than the task: this workflow always
# starts from a clean checkout, so a build directory a desk has had for weeks
# is precisely what the runner lacks. Clearing `target/` is what makes that
# class of failure appear locally at all.
#
# Exit codes name the failure
# class, and the whole set is worth knowing: 2 is a usage error, 10 the run
# failing to complete at all — a lane could not spawn, read, or write
# something it needed, so the thing to suspect is the environment rather than
# the measurement — 11 stream corruption, 12 a resource-budget miss, and 13 a
# performance regression against a committed baseline. Only the two
# measurement classes were listed here until the first red nightly turned out
# to be a 10, which read as unexplained for longer than it needed to.
#
# Scheduled workflows run on the default branch only (a GitHub constraint);
# workflow_dispatch exists so any branch — including this one before it
# merges — can be soaked on demand.
#
# Runner pinning and toolchain discipline match ci.yml: exact images, the
# rust-toolchain.toml pin, third-party actions pinned by full commit SHA.
# No credentials anywhere in this workflow — the endurance lanes replay
# committed recordings and spawn no external CLIs, and the advisories lane
# reads a public database.

name: nightly

on:
  schedule:
    # 03:17 UTC — an off-peak, off-the-hour slot so the run does not queue
    # behind everyone else's midnight crons.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The one check here that is not about endurance. Advisories are re-run
  # nightly because, alone among the supply-chain checks, this one's answer
  # changes without anybody touching the repository: the advisory database is
  # updated daily, so a vulnerability disclosed this morning in a dependency
  # that has not moved in a year should turn the default branch red tonight
  # rather than waiting for whoever happens to open the next pull request.
  #
  # The other three checks — licenses, bans, sources — are absent on purpose.
  # They are a pure function of the committed lockfile, so running them on a
  # schedule could only ever repeat what the pull request that landed the
  # lockfile already established.
  #
  # Its own job rather than a step in the soak below: it takes a minute where
  # the soak takes an hour and a half, and it has no reason to be reported
  # three times over on three operating systems.
  supply-chain:
    name: supply chain (advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - name: Install cargo-deny
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          # Pinned to the version xtask/src/main.rs expects. Bump both
          # together: `cargo xtask deny` refuses a mismatch, so a workflow
          # that drifts from the constant fails this job rather than
          # quietly checking with a different tool than a contributor did.
          tool: cargo-deny@0.20.2
      # This lane is also the one place a suppression may legitimately be
      # added: an advisory with no fixed version published yet is nobody's to
      # fix that night. `cargo xtask deny` holds every such suppression to the
      # review date written into its reason, so adding one buys time rather
      # than silence.
      - name: Fresh advisories against the pinned tree
        run: cargo xtask deny advisories

  soak:
    name: soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Two 30-minute lanes plus the recorded replay, the benchmark set, and a
    # release build: ~75 minutes of scheduled work, with headroom so a slow
    # runner is still a result rather than an infra-failure.
    timeout-minutes: 110
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install the pinned toolchain (rust-toolchain.toml)
        # No toolchain argument on purpose: rustup ≥ 1.28 reads
        # rust-toolchain.toml, so this installs the pin explicitly and fails
        # loudly if it cannot be resolved.
        run: rustup toolchain install && rustup show
      - name: Endurance lanes + nightly benchmarks
        run: cargo xtask soak-nightly
      - name: Report JSON into the job log
        # The reports and monitor series are the durable output; the log is
        # where a maintainer reads them without downloading anything.
        if: always()
        shell: bash
        run: |
          for report in target/perf/*.json; do
            [ -f "$report" ] || continue
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
          for series in target/perf/*.ndjson; do
            [ -f "$series" ] || continue
            echo "::group::$series (first and last 10 samples)"
            head -10 "$series"
            echo "..."
            tail -10 "$series"
            echo "::endgroup::"
          done
