[package]
name = "xtask"
version = "0.0.0"
publish = false
description = "Dev-task runner: the single source of truth for the local + CI check sequence. Every check CI runs is a `cargo xtask` task, so local and CI cannot drift apart."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The one dependency this runner takes, and it earns it: the supply-chain
# gate has to read `deny.toml` to hold advisory suppressions to their review
# dates, and reading TOML by hand lost a dozen times to spellings the format
# permits and this repository had never written.
toml = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"
