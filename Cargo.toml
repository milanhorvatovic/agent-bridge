[workspace]
resolver = "2"
members = [
    "crates/events",
    "crates/fake-cli",
    "tools/cleanup-probe",
    "tools/detection-spike",
    "tools/interactive-probe",
    "tools/perf-probe",
    "tools/probe-child",
    "tools/pty-probe",
    "tools/resize-probe",
    "tools/signal-probe",
    "tools/stub-adapter",
    "tools/utf8-probe",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/milanhorvatovic/agent-bridge"

[workspace.dependencies]
# The plain crates.io release, resolved and held to one exact version by
# Cargo.lock — the probes must test the version a fresh checkout builds.
portable-pty = "0.9"
# The detection spike's matcher engine. The planned runtime compiles literal
# and fixed-prefix patterns into an Aho-Corasick automaton that gates which
# lines each regex runs on; the spike uses the same two crates so its measured
# cost resembles the real execution model, not a stand-in.
aho-corasick = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The event-schema pipeline: the committed schema/ artifacts are *generated*
# from the event types (schemars derive) and never hand-written, so the
# schema and the code cannot drift apart — CI regenerates and fails on any
# difference. `jsonschema` is the validating counterpart, test-scope only:
# it holds the committed golden traces to the committed trace-record schema.
schemars = "1"
jsonschema = { version = "0.49", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Windows-only in practice: the interactive probe's hook listener uses tokio
# named pipes there (a Unix domain socket needs no async runtime on POSIX).
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
# The two virtual-terminal candidates the interactive probe's `vt-eval`
# feature compared. The comparison picked `avt` — the detection spike's
# screen-state pipeline uses it as a regular dependency — while
# `alacritty_terminal` stays behind the probe's non-default feature so the
# comparison remains re-runnable.
alacritty_terminal = "0.26"
avt = "0.18"
# The probe-child fixtures configure their own terminal from the inside —
# termios/sigaction on POSIX; console modes, the ctrl handler, and the
# console code pages on Windows — and utf8-child writes raw bytes with
# WriteFile, below Rust's UTF-16 console path. That is deliberately below
# portable-pty's abstraction: the fixtures observe what the OS actually
# delivers, so they talk to the OS directly.
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # WriteFile, and the OVERLAPPED type its signature names — utf8-child's
    # raw byte path.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # The cleanup probe's containment and census: job objects (create, bind,
    # pid-list, terminate), process opening/handle counts/breakaway flag,
    # and the toolhelp snapshot behind the ConPTY console-host census.
    # Win32_System_Threading also carries GetProcessHandleCount, which the
    # perf probe's resource monitor samples as the Windows spelling of "open
    # file descriptors".
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # The performance counter — the Windows monotonic clock both the fake CLI
    # and the perf probe read, so a timestamp one writes into the stream means
    # something to the other.
    "Win32_System_Performance",
    # Resident-set sampling for the same monitor (GetProcessMemoryInfo).
    "Win32_System_ProcessStatus",
] }
