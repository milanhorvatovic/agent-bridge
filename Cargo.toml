# The runtime's crate layout, declared before the runtime exists.
#
# Each crate under `crates/` is one layer, and the set of internal
# dependencies each may declare is fixed and machine-checked (`cargo xtask
# workspace-gate`): bytes enter at `pty`, meaning is added by `stream`, state
# by `session`, ordering by `core`, and only the binary sees all of it at
# once. Standing the boundaries up empty means no later pull request has to
# invent one under deadline, and a reader sees the architecture as directories
# rather than prose.
#
# Directory names are short (`crates/pty`); package names carry the
# `agent-bridge-` prefix (`agent-bridge-pty`) so a log line or a backtrace
# frame says which crate it came from. Only the `agent-bridge` binary is ever
# distributed — the libraries are internal members, which is why none of them
# is published.
[workspace]
resolver = "2"
members = [
    "crates/adapter-api",
    "crates/agent-bridge",
    "crates/core",
    "crates/events",
    "crates/fake-cli",
    "crates/harness",
    "crates/pty",
    "crates/session",
    "crates/stream",
    "crates/transport",
    "tools/cleanup-probe",
    "tools/detection-spike",
    "tools/interactive-probe",
    "tools/perf-probe",
    "tools/probe-child",
    "tools/pty-probe",
    "tools/resize-probe",
    "tools/signal-probe",
    "tools/stub-adapter",
    "tools/supervisor-ref",
    "tools/utf8-probe",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/milanhorvatovic/agent-bridge"

# Declared once here and inherited by every member (`[lints] workspace = true`,
# which the workspace gate requires), so a lint level is never quietly
# different in one crate. Deliberately minimal: CI already runs clippy with
# `-D warnings`, so this table is for the few levels worth raising *below* CI —
# the ones that should stop a local `cargo build` rather than wait for a push.
[workspace.lints.rust]
# A discarded `Result` in this runtime is a swallowed PTY write, a swallowed
# event publish, or a swallowed shutdown step. Warn-by-default is not enough
# for that class, and waiting for CI to deny it wastes a round trip.
unused_must_use = "deny"

[workspace.lints.clippy]
# `dbg!` is for a debugging session, never for a commit. It also writes to the
# process's own stderr from arbitrary depth, which is exactly the interleaving
# the stdout/stderr discipline in `clippy.toml` exists to prevent.
dbg_macro = "deny"

[workspace.dependencies]
# The plain crates.io release, resolved and held to one exact version by
# Cargo.lock — the probes must test the version a fresh checkout builds.
portable-pty = "0.9"
# The detection spike's matcher engine. The planned runtime compiles literal
# and fixed-prefix patterns into an Aho-Corasick automaton that gates which
# lines each regex runs on; the spike uses the same two crates so its measured
# cost resembles the real execution model, not a stand-in.
aho-corasick = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The event-schema pipeline: the committed schema/ artifacts are *generated*
# from the event types (schemars derive) and never hand-written, so the
# schema and the code cannot drift apart — CI regenerates and fails on any
# difference. `jsonschema` is the validating counterpart, test-scope only:
# it holds the committed golden traces to the committed trace-record schema.
schemars = "1"
jsonschema = { version = "0.49", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Windows-only in practice today: the interactive probe's hook listener uses
# tokio named pipes there (a Unix domain socket needs no async runtime on
# POSIX). The runtime will want more of tokio than this — a multi-threaded
# scheduler, process and signal handling — so expect the feature list to grow
# as consumers land. The exact version is held by Cargo.lock; the caret here
# tracks the 1.x line, and a bump is a reviewed lockfile diff.
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
# The two virtual-terminal candidates the interactive probe's `vt-eval`
# feature compared. The comparison picked `avt` — the detection spike's
# screen-state pipeline uses it as a regular dependency — while
# `alacritty_terminal` stays behind the probe's non-default feature so the
# comparison remains re-runnable.
alacritty_terminal = "0.26"
avt = "0.18"
# The probe-child fixtures configure their own terminal from the inside —
# termios/sigaction on POSIX; console modes, the ctrl handler, and the
# console code pages on Windows — and utf8-child writes raw bytes with
# WriteFile, below Rust's UTF-16 console path. That is deliberately below
# portable-pty's abstraction: the fixtures observe what the OS actually
# delivers, so they talk to the OS directly.
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # WriteFile, and the OVERLAPPED type its signature names — utf8-child's
    # raw byte path.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # The cleanup probe's containment and census: job objects (create, bind,
    # pid-list, terminate), process opening/handle counts/breakaway flag,
    # and the toolhelp snapshot behind the ConPTY console-host census.
    # Win32_System_Threading also carries GetProcessHandleCount, which the
    # perf probe's resource monitor samples as the Windows spelling of "open
    # file descriptors".
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # The performance counter — the Windows monotonic clock both the fake CLI
    # and the perf probe read, so a timestamp one writes into the stream means
    # something to the other.
    "Win32_System_Performance",
    # Resident-set sampling for the same monitor (GetProcessMemoryInfo).
    "Win32_System_ProcessStatus",
] }

# ── Pinned ahead of their first consumer ────────────────────────────────────
#
# The library choices below were made when the implementation language was
# settled, and they are recorded here now so that the crate which first needs
# one inherits it with `dep.workspace = true` instead of picking a version of
# its own. Nothing consumes them yet, so they are absent from Cargo.lock until
# something does — declaring them costs nothing and makes every later version
# change a one-line diff in this file. The workspace gate enforces the other
# half of that bargain: no member may name its own version for a dependency
# pinned here.

# Errors: typed `thiserror` enums in the library crates, mapped to the
# protocol's error codes at the transport boundary. `anyhow` is deliberately
# absent — it belongs only in the binary, and the binary does not need it yet.
thiserror = "2"
# Logging goes to a file or stderr as structured records, never to stdout:
# stdout is the JSON-RPC wire, and one stray line on it corrupts the protocol.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The transcript tailer watches an append-only file the CLI writes. `notify`
# supplies the change notification; the offset bookkeeping that turns a
# notification into "the bytes appended since last time" is ours, because a
# watcher that reports *that* a file changed cannot tell you *what* was added.
# The 9.0 line is still pre-release; move to it deliberately once it is not.
notify = "8"
# Configuration is TOML, validated without launching a session.
toml = "1"
# Authored data — the per-CLI pattern packs and the harness/adapter manifests
# — stays YAML, because a human writes and reviews those files and YAML gives
# them comments and readable multi-line strings. TOML handles the deeply
# nested pattern lists badly and JSON has no comments at all, so neither is a
# fair trade for data whose primary reader is a person.
#
# The deserializer is a maintained fork rather than the original: upstream
# `serde_yaml` is archived and publishes itself as deprecated, and taking an
# abandoned crate for a format this project depends on is the position the
# supply-chain gate exists to prevent. This fork keeps the same API, is still
# receiving commits, and carries no advisory. It is worth knowing that the
# whole `serde_yaml`-fork ecosystem releases slowly — the alternatives are no
# fresher — so treat which fork as a decision to re-examine rather than
# inherit; `cargo xtask deny` is what will say so out loud if this one is ever
# declared unmaintained.
serde_norway = "0.9"
# Dynamic dispatch at the adapter-registry boundary, where the concrete
# adapter type is not known until the session names one. Everywhere else the
# runtime prefers generics; native async fns in traits do not yet cover the
# `dyn`-safe case this one needs.
async-trait = "0.1"
