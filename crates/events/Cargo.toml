# The event taxonomy: the envelope every runtime event shares, every event
# type and its payload, the NDJSON trace-record shape, and the generator that
# turns those types into the committed schema/ artifacts. The published
# contract is *derived from these types*, never hand-written — `schema-gen
# --check` in CI regenerates it and fails on any difference, so the code and
# the published contract cannot drift apart. The taxonomy grows here,
# additively, within schema_version 1.
[package]
name = "agent-bridge-events"
version = "0.0.1"
publish = false
description = "The event taxonomy: the shared event envelope, every event type and its payload, the NDJSON trace-record shape, and the deterministic generator for the committed contract artifacts under schema/."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Validates the committed golden traces against the committed trace-record
# schema — the cross-artifact consistency check (tests/golden_traces.rs).
jsonschema = { workspace = true }

[lib]
name = "agent_bridge_events"
path = "src/lib.rs"

[[bin]]
name = "schema-gen"
path = "src/bin/schema_gen.rs"
