# Output bytes in, structured events out.
#
# The first thing this crate reconstructs is the screen, because that is the
# input the rest of the interpretation is easiest to get wrong without: a CLI
# that repaints regions writes the same words many times, and only a grid can
# say which of those writings are the same words in the same place.
[package]
name = "agent-bridge-stream"
version = "0.0.1"
publish = false
description = "Output bytes in, structured events out: the bounded per-session reader and its encoding-error policy, control-sequence stripping, segmentation, the two-stage pattern matcher under its timing budgets, repaint deduplication, the structured side-channel readers, and the reconstructed-screen fallback."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The snapshot this crate renders is a published event payload, and the
# schema clients read is generated from that crate's types. Building the
# payload type directly — rather than a local twin converted at the edge —
# is what keeps the encoding this crate locks and the encoding the contract
# publishes the same encoding.
agent-bridge-events = { path = "../events" }
# The read contract the per-session reader consumes: chunks cut on character
# boundaries, invalid runs pre-located in stream coordinates, the end reason
# carried. Meaning is added here to bytes that crate moved — the dependency
# points down the layer model and never back.
agent-bridge-pty = { path = "../pty" }
# The `detail` field of a `pty.error` payload is structured JSON; building
# it is the incident-to-event mapping this crate owns. Was a dev-dependency
# for the tests that pin the snapshot's serialized shape by comparing JSON
# documents; those now lean on the same declaration.
serde_json = { workspace = true }
# The reader's hops: bounded channels for text, raw tee, and incidents, the
# select over them, and the one timer a pending encoding burst arms. The
# reader itself stays a plain async fn — no runtime is started here.
tokio = { workspace = true, features = ["sync", "macros", "time"] }
# Typed failures, per the house rule: the layers above decide on these — end
# the session or map to a protocol code — and neither decision can be made
# against a flattened message.
thiserror = { workspace = true }
# The headless terminal emulator behind the reconstructed screen. Chosen over
# the alternative for its dependency weight above all — three transitive
# crates against thirty-two, and that larger subtree carries a second
# terminal-and-event-loop implementation that would sit unused beside the one
# the process-hosting layer already owns. Its read path is small enough that
# the seam wrapping it stays thin, which is what keeps the other candidate a
# swap-in if this emulator's escape repertoire ever proves too narrow for a
# real TUI.
#
# Two consumers now, one grammar. The emulator's own parser also drives the
# text-path stripper: the screen and the stripped stream read the same bytes,
# and giving each its own escape grammar is how the two quietly stop agreeing
# on where a sequence ends. Swapping the emulator therefore means choosing a
# replacement grammar for the stripping seam as well as rewriting the grid
# seam — two files, both of which say so.
avt = { workspace = true }
# Two things a caller cannot see from a return value: when a snapshot was
# actually materialized (the whole point of feeding and rendering being
# separate), and when a mid-stream resize reflowed the grid under it.
tracing = { workspace = true }

[dev-dependencies]
# The reader's component tests drive it on a runtime with a pausable clock,
# so a one-second burst window closes in test time, not wall time.
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
# The independent second implementation of the parsing model the stripper
# rides on. The cross-check test strips the recorded corpus once through our
# `avt`-driven seam and once through a `vte`-driven one and holds the two
# texts byte-equal — the strongest statement available that the strip policy,
# not the grammar underneath it, decides what survives.
vte = { workspace = true }
# The tripwire on the emulator's column geometry asks whether a scalar
# occupies no column, which is a question about Unicode rather than about
# this crate — a hand-written range list was tried and silently missed
# whole blocks of combining marks.
unicode-width = { workspace = true }

[lib]
name = "agent_bridge_stream"
path = "src/lib.rs"

# The reader against a real terminal and a real child, never a mock.
# Mirrors the terminal crate's integration targets: the test binary runs its
# own `main` and doubles as its own child fixture when re-invoked with a
# role argument, which is why the default harness — which would parse that
# argument as a test filter — is off.
[[test]]
name = "reader_pty"
path = "tests/reader_pty.rs"
harness = false

# What a session's screen costs, measured against recorded real sessions
# rather than synthetic escapes, with feeding and examining reported apart —
# because which of the two dominates turned out not to be obvious. Examining
# at a live cadence means rendering, and rendering walks the whole grid, so it
# costs several times what feeding does. Recorded, not gated: the throughput
# budget belongs to the SLO harness, and a second gate here would be a number
# defending itself.
[[bench]]
name = "screen_feed"
path = "benches/screen_feed.rs"
harness = false

# What stripping costs on the same recorded sessions, escape-free text and
# repaint-heavy interfaces reported apart, because the stripper's fast path
# makes those two different workloads. Recorded, not gated, for the same
# reason as above: the evaluation-chain and pipeline budgets that will bind
# this number belong to the layers that own them.
[[bench]]
name = "ansi_strip"
path = "benches/ansi_strip.rs"
harness = false
