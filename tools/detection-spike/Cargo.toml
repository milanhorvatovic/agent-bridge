[package]
name = "agent-bridge-detection-spike"
version = "0.0.1"
publish = false
description = "Replay half of the adapter-detection spike: replays the captured PTY fixtures under tests/corpus through prototype detection pipelines and reports per-pattern hit/miss accounting. The text-matching configuration (a) — ANSI strip, line segmentation, and literal/regex matchers behind an Aho-Corasick prefilter — measures how far line-anchored text matching gets against the repaint streams real TUIs actually emit. Throwaway by design: the corpus and the measurements are the durable outputs, the pipeline is not."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "agent_bridge_detection_spike"
path = "src/lib.rs"

[[bin]]
name = "detection-spike"
path = "src/main.rs"

[dependencies]
aho-corasick = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
