[package]
name = "agent-bridge-probe-child"
version = "0.0.1"
publish = false
description = "Controlled fixture children for the platform probes: utf8-child emits a multi-byte UTF-8 corpus with unbuffered write boundaries deliberately placed mid-codepoint (on Windows with the console code pages forced to UTF-8 first) plus a checksum trailer, and in invalid mode embeds bytes that can never be UTF-8 between valid neighbors; tree-child grows a process tree on command (an in-group sleeper plus a setsid/job-breakaway escape attempt), reports its PIDs, and either exits cleanly on the quit byte or — stubborn mode — survives the polite termination signal so an escalation has something to escalate past. Everything is machine-readable lines the spawning probe reads back through the PTY; the library half carries that report-line protocol — and the UTF-8 corpus itself — so fixtures and probes cannot drift apart. The terminal-mode and resize fixtures that once lived here retired with the probes they served, once the PTY layer's own suites covered the same ground."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[lib]
name = "agent_bridge_probe_child"
path = "src/lib.rs"

[[bin]]
name = "utf8-child"
path = "src/bin/utf8-child.rs"

[[bin]]
name = "tree-child"
path = "src/bin/tree-child.rs"
