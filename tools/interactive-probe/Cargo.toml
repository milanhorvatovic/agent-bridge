[package]
name = "agent-bridge-interactive-probe"
version = "0.0.1"
publish = false
description = "Interactive-CLI probe: spawn a real interactive TUI (Claude Code, or a deterministic stand-in fixture) under the PTY with a hygienic child environment, read the first token within a latency budget, drive it, and shut it down cleanly. Also carries the Windows ConPTY four-point verification and the virtual-terminal library evaluation."
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The virtual-terminal library evaluation replays a captured byte stream into
# both candidate headless grids. Behind a non-default feature so the default
# build carries neither candidate while the choice is still open.
vt-eval = ["dep:alacritty_terminal", "dep:avt"]

[dependencies]
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
alacritty_terminal = { workspace = true, optional = true }
avt = { workspace = true, optional = true }
# The report-line protocol the fixture children speak: the `reports` module
# bridges it to the output tracker so every fixture-spawning probe waits on
# reports through one implementation instead of a per-probe copy.
agent-bridge-probe-child = { path = "../probe-child" }

[target.'cfg(windows)'.dependencies]
# Named-pipe hook listener; POSIX uses a blocking Unix domain socket instead,
# so the async runtime is a Windows-only cost.
tokio = { workspace = true }
# The inspect module's job objects, console-host census, and handle counts.
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The inspect module's process-group enumeration and signal delivery.
libc = { workspace = true }

[lib]
name = "agent_bridge_interactive_probe"
path = "src/lib.rs"

[[bin]]
name = "interactive-probe"
path = "src/bin/interactive-probe.rs"

# The stand-in fixture: the child the PR-tier lane spawns under the PTY.
[[bin]]
name = "interactive-standin"
path = "src/bin/interactive-standin.rs"
