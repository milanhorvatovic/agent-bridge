[package]
name = "agent-bridge-resize-probe"
version = "0.0.1"
publish = false
description = "Resize-propagation probe: spawns the resize-child fixture under a real PTY (ConPTY on Windows) at the runtime's default 80×24, grows it to 120×40 and shrinks it back, and proves each transition is observed as a delivered notification (SIGWINCH handler on POSIX, window-buffer-size event on Windows) while the COLUMNS/LINES env values keep their spawn-time numbers. The early scenario issues the first resize before the fixture's ready line and pins the launch race down to a typed, recorded outcome: the notification may be lost, but the size settles at the requested geometry and later resizes still propagate."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
portable-pty = { workspace = true }
# The ConPTY-hazard-guarded plumbing (timeout-guarded alloc and close, the
# query-answering reader thread, polled child reaping) and the shared
# report-waiting helpers are reused from the interactive probe's library —
# a fix to a guard must land in every probe at once, not drift per copy.
agent-bridge-interactive-probe = { path = "../interactive-probe" }
# The report-line protocol, shared with the fixture so the two sides cannot
# disagree about an event name or a field spelling.
agent-bridge-probe-child = { path = "../probe-child" }

[[bin]]
name = "resize-probe"
path = "src/main.rs"
