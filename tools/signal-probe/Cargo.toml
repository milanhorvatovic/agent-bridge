[package]
name = "agent-bridge-signal-probe"
version = "0.0.1"
publish = false
description = "Interrupt-delivery probe: spawns the probe-child fixture under a real PTY (ConPTY on Windows) and proves the two interrupt mechanisms are distinct — 0x03 written to the master is a keypress a raw-mode child reads as plain data, while a SIGINT delivered to the process group (POSIX) reaches the handler with no byte on stdin. The cooked-mode run shows the terminal itself synthesizing the signal from the same byte, and on Windows records what ConPTY actually does with it."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
portable-pty = { workspace = true }
# The ConPTY-hazard-guarded plumbing (timeout-guarded alloc and close, the
# query-answering reader thread, polled child reaping) is reused from the
# interactive probe's library rather than copied a third time — a fix to a
# guard must land in every probe at once, not drift per copy.
agent-bridge-interactive-probe = { path = "../interactive-probe" }
# The report-line protocol, shared with the fixture so the two sides cannot
# disagree about an event name or a byte spelling.
agent-bridge-probe-child = { path = "../probe-child" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[bin]]
name = "signal-probe"
path = "src/main.rs"
